<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="google" content="notranslate">
<title>لوحة الشرف – نتعلم سوياً</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e27">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Tahoma", "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f172a 100%);
    min-height: 100vh;
    padding: 15px;
    color: #fff;
    line-height: 1.8;
  }
  .container { max-width: 800px; margin: 0 auto; }

  .top-nav {
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(125,211,252,0.2);
    border-radius: 15px;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .top-nav a {
    color: #7dd3fc;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 20px;
    background: rgba(125,211,252,0.1);
  }
  .top-nav a:hover { background: #7dd3fc; color: #0a0e27; }
  .top-nav .title { color: #fbbf24; font-weight: bold; font-size: 14px; }

  .header {
    text-align: center;
    padding: 30px 20px;
    background: radial-gradient(circle at center, rgba(251,191,36,0.2) 0%, transparent 70%);
    border-radius: 20px;
    margin-bottom: 20px;
  }
  .header h1 { color: #fbbf24; font-size: 30px; margin-bottom: 10px; text-shadow: 0 0 20px rgba(251,191,36,0.5); }
  .header p { color: #94a3b8; font-size: 15px; }

  /* تصميم قائمة الشرف المبسطة */
  .honor-box {
    background: rgba(0,0,0,0.4);
    border: 2px solid rgba(251,191,36,0.3);
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }

  .honor-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(90deg, rgba(251,191,36,0.1), transparent);
    border-right: 4px solid #fbbf24;
    padding: 15px 20px;
    margin-bottom: 10px;
    border-radius: 8px;
    font-size: 18px;
    transition: all 0.3s;
  }

  .honor-item:hover {
    transform: translateX(-5px);
    background: linear-gradient(90deg, rgba(251,191,36,0.2), transparent);
  }

  .student-name {
    font-weight: bold;
    color: #fff;
  }

  .student-score {
    background: rgba(16,185,129,0.2);
    color: #6ee7b7;
    padding: 5px 15px;
    border-radius: 20px;
    font-size: 15px;
    border: 1px solid rgba(16,185,129,0.3);
  }
  
  .footer { text-align: center; margin-top: 30px; padding: 20px; color: #94a3b8; font-size: 13px; }
</style>
</head>
<body>

<div class="container">
  <div class="top-nav">
    <a href="index.html">🏠 الرئيسية</a>
    <span class="title">🏆 لوحة الشرف</span>
  </div>

  <div class="header">
    <h1>🏆 لوحة الشرف</h1>
    <p>أسماء الطلاب المتميزين الحاصلين على العلامة الكاملة</p>
  </div>

  <div class="honor-box">
    <!-- 
      🛑 كيفية إضافة طالب جديد:
      ١. انسخ السطر الذي يحتوي على "اسم الطالب" و "20 / 20" بالكامل.
      ٢. الصقه فوق هذا التعليق.
      ٣. غيّر الاسم فقط، واحفظ!
    -->

    <div class="honor-item">
      <span class="student-name">محمد أحمد</span>
      <span class="student-score">20 / 20</span>
    </div>

    <div class="honor-item">
      <span class="student-name">سارة علي</span>
      <span class="student-score">20 / 20</span>
    </div>

    <div class="honor-item">
      <span class="student-name">عمر خالد</span>
      <span class="student-score">19 / 20</span>
    </div>

  </div>

  <div class="footer">
    <p>📚 منصة "نتعلم سوياً" – الصف السابع</p>
  </div>
</div>

</body>
</html>
